<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pseudo selector and more desigining</title>
    <style>
        .container {
            border: 2px solid red;
            background-color: greenyellow;
            padding: 34px;
            margin: 34px auto;
            width: 666px;
        }

        a {
            text-decoration: none;
            color: black;
        }

        a:hover {
            color: green;
            background-color: rgb(80, 76, 76);

        }
        a:visited{
        background-color: yellow;
        }
        a:active{
            background-color: darkblue;
        }

        .btn {
            background-color: red;
            padding: 6px;
            border: none;
            cursor: pointer;
            font-size: 13px;
            border-radius: 4px;
        }
    </style>
</head>

<body>
    <div class="container" id="count1">
        <h3>This is my heading</h3>
        <p>Lorem ipsum dolor sit, amet consectetur adipisicing elit. Enim similique ipsam illo architecto, voluptatem
            placeat adipisci quisquam sint libero amet? Eaque harum saepe obcaecati laborum ut molestiae. Qui, itaque
            culpa.
        </p>
        <a href="https://www.facebook.com"  target="_blank" class="btn">Read more</a>
        <button class="btn">contact us</button>
    </div>

</body>

</html>
