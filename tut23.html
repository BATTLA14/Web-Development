<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Navigation</title>
    <style>
        .navbar {
            background-color: rgb(103, 100, 100);
            border-radius: 30px;
            border: 2px solid #e93434;
            
            


        }

        .navbar ul {
            overflow: auto;
            border: 2px solid #e93434;
            border-radius: 30px;
        }

        .navbar li {
            float: left;
            list-style: none;

            padding: 12px 28px;
        }

        .navbar li a {
            color: rgb(103, 232, 38);
            text-decoration: none;
            padding: 3px 3px;
        }

        .navbar li a:hover {
            color: red;

        }

        .search {
            float: right;
            color: rgb(238, 16, 16);
            padding: 8px 30px;
        }

        .navbar input {
            border: 2px solid rgb(210, 191, 191);
            border-radius: 14px;
            padding: 3px 17px;
            width: 200px;

        }
    </style>
</head>

<body>
    <header>
        <nav class="navbar">
            <ul>
                <li><a href="">Home</a></li>
                <li><a href="">About</a></li>
                <li><a href="">Services</a></li>
                <li><a href="">Contact Us</a></li>
                <div class="search">
                    <input type="search" name="search" id="search" placeholder="search this website">
                </div>

            </ul>
        </nav>
    </header>
</body>

</html>
