<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Height width borders and background</title>
    <style>
        #firstPara {
            background-color: RED;
            height: 100px;
            width: 455px;
            border-color: green;
            border-style: solid;
            border-width: 4px;
            border-radius: 2px;
        }

        #secondPara {
            background-color: RED;
            height: 100px;
            width: 455px;
            border-top: 4px solid violet;
            border-left: 5px solid gold;
            border-right: 5px solid rgb(72, 86, 49);
            border-bottom: 5px solid greenyellow;
            border-top-left-radius: 5px;
        }

        #thirdPara {
            height: 300px;
            width: 450px;
            background-image:url('/269302503_1314554058984541_4697694114943527692_n.jpg');
            background-repeat: no-repeat;
            border: 2px red solid;
            background-position: center center;
            
        }
    </style>
</head>

<body>
    <h4>This is heading</h4>
    <p id="firstPara">This is a heading</p>

    <h3>This is second heading</h3>
    <p id="secondPara">This is secondPara heading</p>

    <h3>This is third heading</h3>
    <p id="thirdPara">This is thirdPara heading</p>
    

</body>

</html>
