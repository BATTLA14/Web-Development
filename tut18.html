<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colors in CSS</title>
<style>
    #firstPara{

        color:red; /*color by name*/
        background-color: aqua;
    }
    #secondPara{
        color:rgb(201,30,235); /*color by rgb value*/
    }
    #thirdPara{
        color:#363059; /*color by hex value*/
    }
</style>
</head>
<body>
    <h4>This is my first box</h4>
    <p id="firstPara">This is a paragraph form first box.</p>
    <p id="secondPara">This is a paragraph form second box.</p>   
    <p id="thirdPara">This is a paragraph form third box.</p>   
</body>
</html>
