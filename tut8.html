<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forms</title>
</head>

<body>
    <h2>This is HTML form tutorials</h2>
    <form action="">
        <div>
            Name:<input type="text" name="Myname">

        </div>
        <br>
        <div>
            Roll No:<input type="text">

        </div>
        <br>
        <div>
            Email:<input type="email" name="" id="">
        </div>
        <br>
        <div>
            Date: <input type="datetime-local" name="" id="">

        </div><br>
        <div>
            Password: <input type="password" name="" id="">
        </div><br>
        <div>
            Are you eligible?<input type="checkbox" name="" id="">

        </div><br>
        <div>
            Gender: Male <input type="radio" name="myGender" id=""> Female<input type="radio" name="myGender">

        </div>
        <div>
            <input type="submit" name="">
            <input type="reset" value="Reset Now">
        </div><br>
        <div>
            write about yourself: <textarea name="" id="" cols="60" rows="10"></textarea>
        </div>
        <div> <br>
            <label for="car">Cars:</label>
            <select name="myCar" id="car">
                <option value="iff">iff</option>

                <option value="if" selected>eff</option>
            </select>
        </div>

    </form>
</body>

</html>
